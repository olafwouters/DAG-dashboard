name: Deploy DAG dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build lowercase entry point with embedded catalogue
        run: python3 scripts/build_pages.py
      - name: Apply planner preferences
        run: python3 scripts/customize_pages.py
      - name: Group thematic and supporting clusters
        run: python3 scripts/group_clusters.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload published site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
